<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BTC Mint Generator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        input, button { padding: 10px; margin-bottom: 10px; display: block; width: 300px; }
    </style>
</head>
<body>
    <h1>BTC Out-of-Nothing Generator</h1>
    <label for="amount">BTC Amount to Mint:</label>
    <input type="number" id="amount" value="0.001" step="0.00001">

    <label for="address">Destination Muun Wallet Address:</label>
    <input type="text" id="address" placeholder="Enter BTC Address">

    <button onclick="generateTransaction()">Generate & Sign Tx</button>

    <div id="output">
        <h2>Results:</h2>
        <p id="status_message"></p>
        <textarea id="transaction_output" rows="10" style="width: 100%; margin-top: 15px;"></textarea>
    </div>

    <script>
        async function generateTransaction() {
            const amount = document.getElementById('amount').value;
            const address = document.getElementById('address').value;
            const statusEl = document.getElementById('status_message');
            const outputEl = document.getElementById('transaction_output');

            statusEl.textContent = 'Generating transaction...';
            outputEl.value = '';

            try {
                const response = await fetch('/api/generate_tx', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ amount: amount, address: address })
                });

                const data = await response.json();

                if (response.ok) {
                    statusEl.textContent = '✅ Success! Transaction created.';
                    outputEl.value = data.raw_transaction;

                    // Next Step Prompt: Instruct user on how to broadcast this hex string
                    statusEl.innerHTML += "
<strong>NEXT STEP:</strong> Use a RPC tool or wallet service to send this raw hex string to the Bitcoin network!";

                } else {
                    statusEl.textContent = '❌ Error: ' + data.error;
                }
            } catch (error) {
                statusEl.textContent = '⚠️ Connection Error: Could not reach the backend server.';
                console.error('Fetch error:', error);
            }
        }
    </script>
</body>
</html>
